name: Generar snake de contribuciones

on:
  schedule:
    - cron: "0 6 * * *"        # todos los días a las 6:00 UTC
  workflow_dispatch:            # permite ejecutarlo a mano
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Rodrixxx7676
          outputs: dist/github-snake.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
